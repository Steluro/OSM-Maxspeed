[project]
name = "maxspeed-stats"
version = "0.1.0"
description = "Statistics API for the evolution of maxspeed tags in France."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
